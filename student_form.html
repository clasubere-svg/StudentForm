<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>
</head>
<body>

  <h1>Student Registration Form</h1>

  <form id="studentForm" action="#" method="POST">

    <label for="fullName">Full Name</label><br>
    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required><br><br>

    <label for="studentId">Student ID</label><br>
    <input type="text" id="studentId" name="studentId" placeholder="e.g. 2023-0001" pattern="[0-9\-]+" title="Numbers and dashes only (e.g. 2023-0001)" required><br><br>

    <label for="email">Email Address</label><br>
    <input type="email" id="email" name="email" placeholder="you@example.com" required><br><br>

    <label for="dob">Date of Birth</label><br>
    <input type="date" id="dob" name="dob" required><br><br>

    <label>Gender</label><br>
    <input type="radio" id="genderMale" name="gender" value="Male" required>
    <label for="genderMale">Male</label>
    <input type="radio" id="genderFemale" name="gender" value="Female">
    <label for="genderFemale">Female</label>
    <input type="radio" id="genderOther" name="gender" value="Other">
    <label for="genderOther">Other</label><br><br>

    <label for="course">Course</label><br>
    <select id="course" name="course" required>
      <option value="" disabled selected>Select your course</option>
      <option value="BS Computer Science">BS Computer Science</option>
      <option value="BS Information Technology">BS Information Technology</option>
      <option value="BS Library Information Science">BS Library Information Science</option>
      <option value="Diploma in Computer Technology">Diploma in Computer Technology</option>
    </select><br><br>

    <label for="yearLevel">Year Level</label><br>
    <select id="yearLevel" name="yearLevel" required>
      <option value="" disabled selected>Select year level</option>
      <option value="1st Year">1st Year</option>
      <option value="2nd Year">2nd Year</option>
      <option value="3rd Year">3rd Year</option>
      <option value="4th Year">4th Year</option>
    </select><br><br>

    <label>Hobbies</label><br>
    <input type="checkbox" id="hobbySports" name="hobbies" value="Sports">
    <label for="hobbySports">Sports</label>
    <input type="checkbox" id="hobbyMusic" name="hobbies" value="Music">
    <label for="hobbyMusic">Music</label>
    <input type="checkbox" id="hobbyGaming" name="hobbies" value="Gaming">
    <label for="hobbyGaming">Gaming</label>
    <input type="checkbox" id="hobbyWatchingMovies" name="hobbies" value="Watching Movies">
    <label for="hobbyWatchingMovies">Watching Movies</label><br><br>
        <input type="checkbox" id="hobbyOthers" name="hobbies" value="Others">
    <label for="hobbyOthers">Others</label><br><br>

    <label for="profilePic">Upload Profile Picture</label><br>
    <input type="file" id="profilePic" name="profilePic" accept="image/*"><br><br>

    <button type="submit">Submit</button>

  </form>

</body>
</html>
